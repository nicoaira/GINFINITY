name: Publish to Anaconda.org

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag to build and publish
        required: true
        default: v1.0.1
        type: string
      force:
        description: Replace an existing Anaconda.org build of this version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: anaconda
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: conda-publish
          channels: conda-forge
          channel-priority: strict
          auto-update-conda: true
          python-version: "3.12"
          conda-build-version: "*"
      - name: Install conda publishing tools
        shell: bash -el {0}
        run: |
          conda install -n base -y conda-build anaconda-client
          conda install -y conda-build anaconda-client
          hash -r
          conda-build --version
          anaconda --version
      - name: Verify tag and package versions
        shell: bash -el {0}
        env:
          RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref }}
        run: |
          python scripts/update_manifest.py --check
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          recipe_version="$(python -c 'import re; print(re.search(r"{% set version = \"([^\"]+)\" %}", open("conda-recipe/meta.yaml").read()).group(1))')"
          test "${RELEASE_REF}" = "v${version}"
          test "${recipe_version}" = "${version}"
      - name: Build and test conda package
        shell: bash -el {0}
        run: conda-build conda-recipe --output-folder conda-dist -c conda-forge
      - name: Upload package to personal channel
        shell: bash -el {0}
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
          ANACONDA_USER: ${{ vars.ANACONDA_USER }}
          ANACONDA_FORCE: ${{ inputs.force }}
        run: |
          test -n "${ANACONDA_API_TOKEN}"
          test -n "${ANACONDA_USER}"
          mapfile -t packages < <(find conda-dist -type f \( -name '*.conda' -o -name '*.tar.bz2' \))
          test "${#packages[@]}" -eq 1
          extra=()
          if [ "${ANACONDA_FORCE}" = "true" ]; then
            extra+=(--force)
          fi
          anaconda --token "${ANACONDA_API_TOKEN}" upload \
            --user "${ANACONDA_USER}" --label main "${extra[@]}" "${packages[0]}"
