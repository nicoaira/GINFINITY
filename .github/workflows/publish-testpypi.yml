name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Git tag or commit to publish
        required: true
        default: v1.0.1
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Verify source and package version
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "${RELEASE_REF}" == v* ]]; then
            test "${RELEASE_REF}" = "v${version}"
          fi
          python scripts/update_manifest.py --check
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distributions
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: testpypi-python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ginfinity
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: testpypi-python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
